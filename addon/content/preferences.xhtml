<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h1 data-l10n-id="pref-title"></html:h1></label>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-insights"></html:h2></label>
    <hbox align="center">
      <html:label data-l10n-id="pref-insights-defaultView"></html:label>
      <menulist preference="hub.defaultView">
        <menupopup>
          <menuitem value="coauthorship" label="Co-authorship" />
          <menuitem value="author-paper" label="Author / paper" />
          <menuitem value="pubs-per-year" label="Publications / year" />
          <menuitem value="top-sources" label="Top sources" />
          <menuitem value="top-authors" label="Top authors" />
          <menuitem value="composition" label="Composition" />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-insights-theme"></html:label>
      <menulist preference="hub.theme">
        <menupopup>
          <menuitem value="auto" label="auto" />
          <menuitem value="light" label="light" />
          <menuitem value="dark" label="dark" />
        </menupopup>
      </menulist>
      <html:label data-l10n-id="pref-insights-scope"></html:label>
      <menulist preference="hub.scope">
        <menupopup>
          <menuitem value="library" label="whole library" />
          <menuitem value="view" label="current view" />
          <menuitem value="selection" label="selection" />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-insights-topN"></html:label>
      <html:input type="number" min="1" max="100" preference="hub.topN" />
    </hbox>
  </groupbox>

  <vbox>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></html:label>
  </vbox>
</vbox>
